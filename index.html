<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>SharkQuest V3.2</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#061116;color:#f3f7f8;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;color:inherit}#app{max-width:980px;margin:auto;padding:8px}.hide{display:none!important}.glass{background:#07171ddd;border:1px solid #ffffff2a;border-radius:18px;box-shadow:0 10px 30px #0007;backdrop-filter:blur(8px)}.top{display:flex;align-items:center;margin-bottom:8px}.logo{font-size:clamp(25px,6vw,40px);font-weight:1000}.logo i{font-style:normal;color:#ec7a2d}.tag{margin-left:auto;background:#ffffff13;padding:7px 10px;border-radius:99px;font-size:11px}.start{position:relative;overflow:hidden;min-height:650px;padding:16px;background:linear-gradient(135deg,#18373d,#09171b)}.start:before{content:"";position:absolute;inset:0;background:var(--hero,linear-gradient(135deg,#255b64,#101c21)) center/cover;filter:brightness(.35);transform:scale(1.03)}.start>*{position:relative}.start h1{font-size:clamp(40px,10vw,74px);line-height:.9;margin:16px 0 10px;max-width:700px}.start p{max-width:660px;line-height:1.45}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:700px;margin-top:16px}.choice{padding:0;border:3px solid transparent;border-radius:18px;overflow:hidden;background:#11252b;position:relative;min-height:170px}.choice.sel{border-color:#ec7a2d;transform:translateY(-2px)}.choice img{width:100%;height:220px;object-fit:cover;display:block;background:linear-gradient(#25434a,#172b30)}.choice span{position:absolute;left:10px;bottom:10px;background:#041217df;padding:8px 12px;border-radius:99px;font-weight:1000}.go{border:0;background:#e5792d;padding:13px 16px;border-radius:14px;font-weight:1000;min-height:50px;margin-top:10px}.go:disabled{opacity:.45}.hud{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:7px}.face{width:45px;height:45px;border-radius:50%;object-fit:cover;border:2px solid #fff;background:#16343b}.name{font-weight:1000;margin-right:auto}.stat{background:#ffffff12;border:1px solid #ffffff18;border-radius:99px;padding:7px 10px;font-size:12px}.quest{width:100%;padding:8px 10px;font-size:12px}.world{height:650px;position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(#274c4e,#14292f);border:1px solid #ffffff20}.worldbg{position:absolute;inset:-3%;background:var(--world,linear-gradient(#355,#123)) center/cover;filter:brightness(.56);transition:.18s}.world.walk .worldbg{transform:scale(1.025);filter:brightness(.5)}.shade{position:absolute;inset:0;background:linear-gradient(#0005,#0000 42%,#000c)}.zone{position:absolute;left:10px;top:10px;padding:8px 10px;z-index:4}.tools{position:absolute;right:10px;top:10px;z-index:5;display:flex;gap:5px}.tools button,.controls button{border:1px solid #ffffff2b;background:#04141adc;border-radius:12px;font-weight:1000}.tools button{padding:9px}.player{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:4;display:flex;align-items:end;gap:3px;filter:drop-shadow(0 8px 10px #000)}.human{width:72px;height:160px;position:relative}.human:before{content:"";position:absolute;left:22px;top:0;width:29px;height:30px;background:#30241e;border-radius:50%}.human:after{content:"";position:absolute;left:7px;top:27px;width:58px;height:126px;border-radius:24px 24px 10px 10px;background:linear-gradient(#695342,#252b2c)}.dog{width:60px;height:75px;position:relative}.dog:before{content:"";position:absolute;left:4px;bottom:3px;width:50px;height:35px;border-radius:50%;background:#101315}.dog:after{content:"";position:absolute;left:13px;top:10px;width:31px;height:33px;border-radius:50%;background:linear-gradient(90deg,#101315 38%,#eee 39% 60%,#101315 61%)}.controls{position:absolute;right:10px;bottom:10px;z-index:5;display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:3px}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.mini{position:absolute;left:10px;bottom:10px;z-index:5;width:155px;padding:8px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.cell{height:23px;border-radius:5px;background:#31545b}.cell.reed{background:#5a8246}.cell.water{background:#287181}.cell.hut{background:#9d7540}.cell.rock{background:#535d60}.cell.me{outline:3px solid #ec7a2d}.toast{position:absolute;left:50%;bottom:82px;transform:translateX(-50%);z-index:7;background:#031015e9;border-radius:99px;padding:8px 12px;font-size:12px;opacity:0;transition:.15s}.toast.on{opacity:1}.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:8;pointer-events:none}.flash.on{animation:flash .65s}@keyframes flash{20%{opacity:1}100%{opacity:0}}.modal{position:fixed;inset:0;background:#01080ce8;z-index:30;display:flex;align-items:center;justify-content:center;padding:7px}.battlebox{width:min(1000px,100%);height:94vh;max-height:760px;position:relative;overflow:hidden;border-radius:20px;background:#10262c}.battlebg{position:absolute;inset:0;background:var(--battle,linear-gradient(#366,#123)) center/cover;animation:drift 5s ease-in-out infinite alternate}@keyframes drift{to{transform:scale(1.035)}}.enemy{position:absolute;left:10px;top:10px;z-index:4;min-width:220px;padding:9px 11px}.hp{height:9px;background:#ffffff30;border-radius:99px;overflow:hidden;margin-top:5px}.hp i{display:block;height:100%;background:#63ca6f;transition:.25s}.status{position:absolute;right:10px;top:10px;z-index:4;padding:8px;font-size:12px}.bottom{position:absolute;left:8px;right:8px;bottom:8px;z-index:5;display:grid;grid-template-columns:1.2fr .8fr;gap:7px}.text{padding:11px;font-weight:850;min-height:90px}.acts{padding:7px;display:grid;grid-template-columns:1fr 1fr;gap:5px}.acts button{border:0;border-radius:11px;background:#17333b;min-height:46px;font-weight:1000}.acts .cap{background:#963d41}.acts .syr{background:#81661f}.panel{width:min(660px,100%);max-height:90vh;overflow:auto;padding:12px}.head{display:flex;justify-content:space-between}.head button{border:0;background:#ffffff12;border-radius:50%;width:40px}.dex{display:grid;grid-template-columns:1fr 1fr;gap:7px}.item{padding:9px;border:1px solid #ffffff1a;background:#ffffff0d;border-radius:12px}.lock{opacity:.42;filter:grayscale(1)}@media(max-width:640px){.choice img{height:165px}.world{height:640px}.bottom{grid-template-columns:1fr}.dex{grid-template-columns:1fr}.battlebox{height:95vh}}</style></head><body><div id="app"><div class="top"><div class="logo">SHARK<i>QUEST</i></div><div class="tag">V3.2 RÉALISTE</div></div><section id="start" class="start glass"><h1>L'île est à toi.</h1><p>Choisis Justine ou Guillaume. Syrachi te suit partout. Explore l'île, traverse les roseaux du lagon, rencontre des requins sauvages et capture-les.</p><div class="choices"><button type="button" class="choice" data-char="Justine"><img id="justineImg"><span>Justine</span></button><button type="button" class="choice" data-char="Guillaume"><img id="guillaumeImg"><span>Guillaume</span></button></div><button type="button" id="newGame" class="go" disabled>Choisis ton personnage</button><button type="button" id="resume" class="go hide" style="background:#486f65">Reprendre la sauvegarde</button></section><section id="game" class="hide"><div class="hud"><img id="hudFace" class="face"><img id="dogFace" class="face"><div class="name"><span id="hudName"></span> + Syrachi</div><div class="stat">❤️ <b id="energy">100</b></div><div class="stat">🔴 <b id="balls">8</b></div><div class="stat">🦈 <b id="caught">0</b></div><div id="quest" class="quest glass"></div></div><div id="world" class="world"><div id="worldBg" class="worldbg"></div><div class="shade"></div><div class="zone glass"><b>ÎLE DES REQUINS</b><small id="zoneText">Côte sud</small></div><div class="tools"><button id="dexBtn">📘</button><button id="bagBtn">🎒</button></div><div class="player"><div class="dog"></div><div class="human"></div></div><div class="mini glass"><div id="miniGrid" class="grid"></div></div><div class="controls"><button class="up" data-dir="u">▲</button><button class="left" data-dir="l">◀</button><button class="down" data-dir="d">▼</button><button class="right" data-dir="r">▶</button></div><div id="toast" class="toast"></div><div id="flash" class="flash"></div></div></section></div><div id="battleModal" class="modal hide"><div class="battlebox"><div id="battleBg" class="battlebg"></div><div class="enemy glass"><b id="enemyName"></b><small id="enemyMeta"></small><div class="hp"><i id="enemyHp"></i></div></div><div id="battleStatus" class="status glass">Observation</div><div class="bottom"><div id="battleText" class="text glass"></div><div class="acts glass"><button id="observe">👀 Observer</button><button id="catchBtn" class="cap">🔴 Capturer</button><button id="syrachiBtn" class="syr">🐕 Syrachi</button><button id="runBtn">🏃 Reculer</button></div></div></div></div><div id="dexModal" class="modal hide"><div class="panel glass"><div class="head"><h2>📘 SharkDex</h2><button data-close="dexModal">✕</button></div><div id="dex" class="dex"></div></div></div><div id="bagModal" class="modal hide"><div class="panel glass"><div class="head"><h2>🎒 Sac</h2><button data-close="bagModal">✕</button></div><div id="bag"></div></div></div><script>(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let selected=null,battle=null;const KEY='sharkquest-v32';let S={char:'Justine',x:2,y:4,energy:100,balls:8,caught:{},steps:0};const A={};const map=[['water','water','rock','rock','water'],['water','reed','reed','grass','water'],['grass','grass','grass','reed','water'],['hut','grass','reed','reed','grass'],['rock','grass','grass','grass','rock']];const sharks=[['recif','Requin de récif','Commun',.66,6,'🦈'],['marteau','Requin marteau','Commun',.58,8,'🔨🦈'],['tigre','Requin tigre','Peu commun',.48,10,'🐯🦈'],['mako','Requin mako','Rare',.38,12,'💨🦈'],['blanc','Grand requin blanc','Rare',.31,14,'⚪🦈'],['baleine','Requin-baleine','Très rare',.25,9,'🌌🦈'],['meg','Mégalodon','Légendaire',.16,18,'🦷🦈']].map(x=>({id:x[0],name:x[1],rarity:x[2],base:x[3],power:x[4],emoji:x[5]}));function choose(name,el){selected=name;$$('.choice').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');$('#newGame').disabled=false;$('#newGame').textContent='Commencer avec '+name}$$('.choice').forEach(b=>{b.onclick=()=>choose(b.dataset.char,b)});function save(){localStorage.setItem(KEY,JSON.stringify(S))}function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.char){S={...S,...x};return true}}catch(e){}return false}function update(){let f=S.char==='Justine'?A.justine:A.guillaume;if(f)$('#hudFace').src=f;if(A.syrachi)$('#dogFace').src=A.syrachi;$('#hudName').textContent=S.char;$('#energy').textContent=S.energy;$('#balls').textContent=S.balls;$('#caught').textContent=Object.values(S.caught).reduce((a,b)=>a+b,0);let sp=Object.keys(S.caught).length;$('#quest').textContent=sp>=5?`Mission accomplie : ${sp}/7 espèces découvertes.`:`Objectif : capturer 5 espèces différentes — ${sp}/5.`;$('#zoneText').textContent=map[S.y][S.x]==='reed'?'Lagon aux roseaux':map[S.y][S.x]==='hut'?'Cabane de survie':'Côte sud';renderMini()}function renderMini(){let g=$('#miniGrid');g.innerHTML='';for(let y=0;y<5;y++)for(let x=0;x<5;x++){let d=document.createElement('div');d.className='cell '+map[y][x]+(x===S.x&&y===S.y?' me':'');g.appendChild(d)}}function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1500)}function enter(){S.char=selected||S.char;$('#start').classList.add('hide');$('#game').classList.remove('hide');update();save()}$('#newGame').onclick=()=>{S={char:selected,x:2,y:4,energy:100,balls:8,caught:{},steps:0};enter()};if(load()){$('#resume').classList.remove('hide');$('#resume').onclick=()=>{selected=S.char;enter()}}function move(dx,dy){if(battle)return;let nx=S.x+dx,ny=S.y+dy;if(nx<0||ny<0||nx>4||ny>4||['water','rock'].includes(map[ny][nx]))return toast('Passage impossible.');S.x=nx;S.y=ny;S.steps++;$('#world').classList.add('walk');setTimeout(()=>$('#world').classList.remove('walk'),170);if(map[ny][nx]==='hut'){S.energy=100;S.balls=Math.max(S.balls,8);toast('Cabane : énergie et Pokéballs restaurées.')}update();save();if(map[ny][nx]==='reed'&&Math.random()<.34){$('#flash').classList.add('on');setTimeout(()=>$('#flash').classList.remove('on'),650);setTimeout(startBattle,400)}}$$('[data-dir]').forEach(b=>b.onclick=()=>{let d=b.dataset.dir;move(d==='r'?1:d==='l'?-1:0,d==='d'?1:d==='u'?-1:0)});addEventListener('keydown',e=>{if(e.key==='ArrowUp')move(0,-1);if(e.key==='ArrowDown')move(0,1);if(e.key==='ArrowLeft')move(-1,0);if(e.key==='ArrowRight')move(1,0)});function pick(){let r=Math.random();return r<.28?sharks[0]:r<.51?sharks[1]:r<.69?sharks[2]:r<.82?sharks[3]:r<.92?sharks[4]:r<.985?sharks[5]:sharks[6]}function startBattle(){let s=pick(),lvl=2+Math.floor(S.steps/8)+Math.floor(Math.random()*3);battle={s,lvl,hp:100,shield:false,dogUsed:false};$('#enemyName').textContent=s.name;$('#enemyMeta').textContent=`Niv. ${lvl} • ${s.rarity}`;$('#enemyHp').style.width='100%';$('#battleStatus').textContent='Le requin vous observe…';$('#battleText').textContent=`Un ${s.name} surgit devant ${S.char} et Syrachi.`;$('#battleBg').style.setProperty('--battle',`url(${S.char==='Justine'?(A.bj||A.explore||''):(A.bg||A.explore||'')})`);$('#battleModal').classList.remove('hide');setControls(true)}function setControls(on){$$('.acts button').forEach(b=>b.disabled=!on);if(battle)$('#syrachiBtn').disabled=battle.dogUsed||!on}function riposte(){let d=battle.s.power+Math.floor(Math.random()*6);if(battle.shield){d=Math.ceil(d/2);battle.shield=false}S.energy=Math.max(0,S.energy-d);update();save();$('#battleStatus').textContent=`Riposte : -${d} énergie`;if(S.energy<=0){setControls(false);$('#battleText').textContent='Syrachi te ramène à la cabane.';setTimeout(()=>{S.x=0;S.y=3;S.energy=100;battle=null;$('#battleModal').classList.add('hide');update();save()},900);return true}return false}$('#observe').onclick=()=>{if(!battle)return;setControls(false);let d=16+Math.floor(Math.random()*18);battle.hp=Math.max(8,battle.hp-d);$('#enemyHp').style.width=battle.hp+'%';$('#battleText').textContent=`Tu observes et fatigues le requin : -${d}.`;setTimeout(()=>{if(!riposte())setControls(true)},600)};$('#syrachiBtn').onclick=()=>{battle.shield=true;battle.dogUsed=true;$('#battleText').textContent='Syrachi détourne son attention : prochaine riposte divisée par deux.';$('#syrachiBtn').disabled=true};$('#catchBtn').onclick=()=>{if(!battle)return;if(S.balls<=0)return $('#battleText').textContent='Plus de Pokéballs.';S.balls--;update();save();setControls(false);let chance=Math.min(.94,battle.s.base+(100-battle.hp)/125);$('#battleText').textContent='Pokéball lancée…';setTimeout(()=>{if(Math.random()<chance){S.caught[battle.s.id]=(S.caught[battle.s.id]||0)+1;update();save();$('#battleText').textContent=`Capturé ! ${battle.s.name} rejoint le SharkDex.`;setTimeout(()=>{battle=null;$('#battleModal').classList.add('hide')},800)}else{$('#battleText').textContent='Il se libère !';if(!riposte())setControls(true)}},850)};$('#runBtn').onclick=()=>{if(!battle)return;if(Math.random()<.82){battle=null;$('#battleModal').classList.add('hide')}else{$('#battleText').textContent='Impossible de reculer !';riposte()}};$('#dexBtn').onclick=()=>{let g=$('#dex');g.innerHTML='';sharks.forEach(s=>{let n=S.caught[s.id]||0,d=document.createElement('div');d.className='item'+(n?'':' lock');d.innerHTML=`<b>${n?s.emoji+' '+s.name:'❔ Espèce inconnue'}</b><div style='font-size:12px'>${n?s.rarity+' • capturé x'+n:'Explore les roseaux.'}</div>`;g.appendChild(d)});$('#dexModal').classList.remove('hide')};$('#bagBtn').onclick=()=>{$('#bag').innerHTML=`<div class='item'>🔴 Pokéballs : ${S.balls}</div><div class='item'>❤️ Énergie : ${S.energy}/100</div><div class='item'>🐕 Syrachi : protection disponible à chaque rencontre</div>`;$('#bagModal').classList.remove('hide')};$$('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).classList.add('hide'));async function asset(n){try{let r=await fetch('assets/'+n+'.b64',{cache:'no-store'});if(!r.ok)throw 0;let t=(await r.text()).replace(/\s/g,'');let bin=atob(t),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return URL.createObjectURL(new Blob([u],{type:'image/webp'}))}catch(e){return null}}Promise.all(['justine','guillaume','syrachi','explore','battle_justine','battle_guillaume'].map(asset)).then(v=>{[A.justine,A.guillaume,A.syrachi,A.explore,A.bj,A.bg]=v;if(A.justine)$('#justineImg').src=A.justine;if(A.guillaume)$('#guillaumeImg').src=A.guillaume;if(A.syrachi)$('#dogFace').src=A.syrachi;if(A.explore){document.querySelector('.start').style.setProperty('--hero',`url(${A.explore})`);$('#worldBg').style.setProperty('--world',`url(${A.explore})`)}update()});update()})();</script></body></html>
