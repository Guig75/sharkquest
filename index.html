<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>SharkQuest V3</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#071217;color:#eef8f9;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;color:inherit}#app{max-width:980px;margin:auto;padding:8px}.hide{display:none!important}.glass{background:#08171cdd;border:1px solid #ffffff28;border-radius:18px;box-shadow:0 10px 35px #0008;backdrop-filter:blur(8px)}.top{display:flex;align-items:center;margin-bottom:8px}.logo{font-weight:1000;font-size:clamp(24px,6vw,40px)}.logo i{color:#ec7d2d;font-style:normal}.tag{margin-left:auto;font-size:11px;padding:7px 9px;border-radius:99px;background:#ffffff12}.start{min-height:690px;position:relative;overflow:hidden;padding:16px}.startBg{position:absolute;inset:0;background:center/cover;filter:brightness(.35);transform:scale(1.02)}.start>*:not(.startBg){position:relative}.start h1{font-size:clamp(40px,10vw,76px);line-height:.88;margin:16px 0 10px;max-width:700px}.start p{max-width:650px;line-height:1.4}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:700px;margin-top:15px}.choice{padding:0;border:3px solid transparent;border-radius:18px;overflow:hidden;background:#11252b;position:relative}.choice.sel{border-color:#ec7d2d}.choice img{width:100%;height:230px;object-fit:cover;display:block}.choice span{position:absolute;left:9px;bottom:9px;background:#061419dd;padding:7px 11px;border-radius:99px;font-weight:900}.go{border:0;background:#e47a2e;border-radius:14px;padding:13px 16px;font-weight:1000;margin-top:10px;min-height:49px}.go:disabled{opacity:.4}.hud{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:7px}.face{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid #fff}.name{font-weight:1000;margin-right:auto}.stat{background:#ffffff13;border:1px solid #ffffff18;padding:6px 9px;border-radius:99px;font-size:12px}.quest{width:100%;padding:7px 10px;font-size:12px}.world{height:650px;position:relative;overflow:hidden;border-radius:20px;border:1px solid #ffffff22;background:#123}.worldBg{position:absolute;inset:-3%;background:center/cover;filter:brightness(.56);transition:.18s}.world.walk .worldBg{transform:scale(1.025);filter:brightness(.51)}.shade{position:absolute;inset:0;background:linear-gradient(#0004,#0000 40%,#000b)}.zone{position:absolute;left:10px;top:10px;z-index:4;padding:8px 10px}.zone b{display:block}.playerWrap{position:absolute;z-index:4;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:end;gap:3px;filter:drop-shadow(0 8px 12px #000)}.human{width:72px;height:165px;position:relative}.human:before{content:"";position:absolute;top:0;left:22px;width:29px;height:31px;border-radius:50%;background:#2b211d}.human:after{content:"";position:absolute;top:28px;left:6px;width:60px;height:126px;border-radius:25px 25px 10px 10px;background:linear-gradient(#594c3d,#232a2c)}.dog{width:60px;height:77px;position:relative}.dog:before{content:"";position:absolute;left:4px;bottom:4px;width:50px;height:35px;border-radius:50%;background:#111}.dog:after{content:"";position:absolute;top:12px;left:13px;width:30px;height:32px;border-radius:50%;background:linear-gradient(90deg,#111 38%,#eee 39% 60%,#111 61%)}.controls{position:absolute;right:10px;bottom:10px;z-index:5;display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:3px}.controls button,.tools button{border:1px solid #ffffff28;background:#06161cdd;border-radius:12px;font-weight:1000}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.tools{position:absolute;right:10px;top:10px;z-index:5;display:flex;gap:5px}.tools button{padding:8px}.mini{position:absolute;left:10px;bottom:10px;z-index:5;padding:8px;width:154px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.cell{height:23px;border-radius:5px;background:#31525a}.cell.reed{background:#537d43}.cell.water{background:#266c78}.cell.hut{background:#9b7542}.cell.rock{background:#49575c}.cell.me{outline:3px solid #ec7d2d}.toast{position:absolute;left:50%;bottom:82px;transform:translateX(-50%);z-index:7;background:#051116e9;padding:8px 11px;border-radius:99px;font-size:12px;opacity:0;transition:.15s}.toast.on{opacity:1}.flash{position:absolute;inset:0;background:white;opacity:0;z-index:8;pointer-events:none}.flash.on{animation:flash .7s}@keyframes flash{20%{opacity:1}100%{opacity:0}}.modal{position:fixed;inset:0;background:#02090de8;z-index:30;display:flex;align-items:center;justify-content:center;padding:7px}.battle{width:min(1000px,100%);height:94vh;max-height:760px;position:relative;overflow:hidden;border-radius:20px;background:#000}.battleBg{position:absolute;inset:0;background:center/cover;animation:drift 5s ease-in-out infinite alternate}@keyframes drift{to{transform:scale(1.03)}}.enemy{position:absolute;left:10px;top:10px;z-index:4;padding:9px 11px;min-width:220px}.enemy b{display:block}.hp{height:9px;background:#ffffff30;border-radius:99px;overflow:hidden;margin-top:5px}.hp i{display:block;height:100%;background:#62c96e;transition:.25s}.status{position:absolute;right:10px;top:10px;z-index:4;padding:8px;font-size:12px}.battleBottom{position:absolute;left:8px;right:8px;bottom:8px;z-index:5;display:grid;grid-template-columns:1.2fr .8fr;gap:7px}.battleText{padding:11px;font-weight:800;min-height:92px}.acts{padding:7px;display:grid;grid-template-columns:1fr 1fr;gap:5px}.acts button{border:0;border-radius:11px;background:#173139;min-height:46px;font-weight:1000}.acts .cap{background:#9c3b3e}.acts .syr{background:#80651f}.panel{width:min(660px,100%);max-height:90vh;overflow:auto;padding:12px}.head{display:flex;justify-content:space-between}.head button{border:0;background:#ffffff12;border-radius:50%;width:38px}.dex{display:grid;grid-template-columns:1fr 1fr;gap:7px}.item{padding:9px;border-radius:12px;background:#ffffff0c;border:1px solid #ffffff18}.lock{opacity:.42;filter:grayscale(1)}@media(max-width:640px){.start{min-height:620px}.choice img{height:165px}.world{height:640px}.battleBottom{grid-template-columns:1fr}.battleText{min-height:65px}.dex{grid-template-columns:1fr}.battle{height:95vh}}
</style></head><body><div id="app"><div class="top"><div class="logo">SHARK<i>QUEST</i></div><div class="tag">V3 RÉALISTE</div></div>
<section id="start" class="start glass"><div id="startBg" class="startBg"></div><h1>Survivre. Explorer. Capturer.</h1><p>Choisis Justine ou Guillaume. Syrachi te suit partout. Traverse l'île, approche les lagons et capture les requins qui apparaissent.</p><div class="choices"><button class="choice" data-c="Justine"><img id="justineImg"><span>Justine</span></button><button class="choice" data-c="Guillaume"><img id="guillaumeImg"><span>Guillaume</span></button></div><button id="go" class="go" disabled>Choisis ton personnage</button><button id="resume" class="go hide" style="background:#446f63">Reprendre la sauvegarde</button></section>
<section id="game" class="hide"><div class="hud"><img id="hudFace" class="face"><img id="dogFace" class="face"><div class="name"><span id="hudName"></span> + Syrachi</div><div class="stat">❤️ <b id="energy">100</b></div><div class="stat">🔴 <b id="balls">8</b></div><div class="stat">🦈 <b id="caught">0</b></div><div class="quest glass" id="quest"></div></div><div id="world" class="world"><div id="worldBg" class="worldBg"></div><div class="shade"></div><div class="zone glass"><b>ÎLE DES REQUINS</b><small id="zoneText">Côte sud</small></div><div class="tools"><button id="dexBtn">📘</button><button id="bagBtn">🎒</button></div><div class="playerWrap"><div class="dog"></div><div class="human"></div></div><div class="mini glass"><div id="miniGrid" class="grid"></div></div><div class="controls"><button class="up" data-d="u">▲</button><button class="left" data-d="l">◀</button><button class="down" data-d="d">▼</button><button class="right" data-d="r">▶</button></div><div id="toast" class="toast"></div><div id="flash" class="flash"></div></div></section></div>
<div id="battle" class="modal hide"><div class="battle"><div id="battleBg" class="battleBg"></div><div class="enemy glass"><b id="enemyName"></b><small id="enemyMeta"></small><div class="hp"><i id="enemyHp"></i></div></div><div id="battleStatus" class="status glass">Observation</div><div class="battleBottom"><div id="battleText" class="battleText glass"></div><div class="acts glass"><button id="observe">👀 Observer</button><button id="catch" class="cap">🔴 Capturer</button><button id="syrachi" class="syr">🐕 Syrachi</button><button id="run">🏃 Reculer</button></div></div></div></div>
<div id="dexModal" class="modal hide"><div class="panel glass"><div class="head"><h2>📘 SharkDex</h2><button data-close="dexModal">✕</button></div><div id="dex" class="dex"></div></div></div><div id="bagModal" class="modal hide"><div class="panel glass"><div class="head"><h2>🎒 Sac</h2><button data-close="bagModal">✕</button></div><div id="bag"></div></div></div>
<script>
(async()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];async function asset(name){let t=await fetch('assets/'+name+'.b64').then(r=>r.text());let b=atob(t.trim()),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return URL.createObjectURL(new Blob([a],{type:'image/webp'}))}const A={justine:await asset('justine'),guillaume:await asset('guillaume'),syrachi:await asset('syrachi'),explore:await asset('explore'),bj:await asset('battle_justine'),bg:await asset('battle_guillaume')};$('#justineImg').src=A.justine;$('#guillaumeImg').src=A.guillaume;$('#dogFace').src=A.syrachi;$('#startBg').style.backgroundImage=`url(${A.explore})`;$('#worldBg').style.backgroundImage=`url(${A.explore})`;
const sharks=[['recif','Requin de récif','Commun',.66,6,'🦈'],['marteau','Requin marteau','Commun',.58,8,'🔨🦈'],['tigre','Requin tigre','Peu commun',.48,10,'🐯🦈'],['mako','Requin mako','Rare',.38,12,'💨🦈'],['blanc','Grand requin blanc','Rare',.31,14,'⚪🦈'],['baleine','Requin-baleine','Très rare',.25,9,'🌌🦈'],['meg','Mégalodon','Légendaire',.16,18,'🦷🦈']].map(x=>({id:x[0],name:x[1],rarity:x[2],base:x[3],power:x[4],emoji:x[5]}));const map=[['water','water','rock','rock','water'],['water','reed','reed','grass','water'],['grass','grass','grass','reed','water'],['hut','grass','reed','reed','grass'],['rock','grass','grass','grass','rock']];let selected=null,battle=null,S={char:'Justine',x:2,y:4,px:2,py:4,energy:100,balls:8,caught:{},steps:0};const KEY='sharkquest-v3';function save(){localStorage.setItem(KEY,JSON.stringify(S))}function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.char){S={...S,...x};return true}}catch{}return false}function update(){let face=S.char==='Justine'?A.justine:A.guillaume;$('#hudFace').src=face;$('#hudName').textContent=S.char;$('#energy').textContent=S.energy;$('#balls').textContent=S.balls;$('#caught').textContent=Object.values(S.caught).reduce((a,b)=>a+b,0);let sp=Object.keys(S.caught).length;$('#quest').textContent=sp>=5?`Mission accomplie : ${sp}/7 espèces découvertes.`:`Objectif : capturer 5 espèces différentes — ${sp}/5.`;$('#zoneText').textContent=map[S.y][S.x]==='reed'?'Lagon aux roseaux':map[S.y][S.x]==='hut'?'Cabane de survie':'Côte sud';renderMini()}function renderMini(){let g=$('#miniGrid');g.innerHTML='';for(let y=0;y<5;y++)for(let x=0;x<5;x++){let d=document.createElement('div');d.className='cell '+map[y][x]+(x===S.x&&y===S.y?' me':'');g.appendChild(d)}}function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1500)}function move(dx,dy){if(battle)return;let nx=S.x+dx,ny=S.y+dy;if(nx<0||ny<0||nx>4||ny>4||['water','rock'].includes(map[ny][nx]))return toast('Passage impossible.');S.px=S.x;S.py=S.y;S.x=nx;S.y=ny;S.steps++;$('#world').classList.add('walk');setTimeout(()=>$('#world').classList.remove('walk'),160);if(map[ny][nx]==='hut'){S.energy=100;S.balls=Math.max(8,S.balls);toast('Cabane : énergie et Pokéballs restaurées.')}update();save();if(map[ny][nx]==='reed'&&Math.random()<.34){$('#flash').classList.add('on');setTimeout(()=>$('#flash').classList.remove('on'),650);setTimeout(encounter,380)}}function pick(){let r=Math.random();return r<.28?sharks[0]:r<.51?sharks[1]:r<.69?sharks[2]:r<.82?sharks[3]:r<.92?sharks[4]:r<.985?sharks[5]:sharks[6]}function encounter(){let s=pick();battle={s,hp:100,dog:false,used:false};$('#enemyName').textContent=s.name;$('#enemyMeta').textContent=s.rarity;$('#enemyHp').style.width='100%';$('#battleStatus').textContent='Le requin vous observe';$('#battleText').textContent=`Un ${s.name} surgit du lagon. ${S.char} et Syrachi lui font face.`;$('#battleBg').style.backgroundImage=`url(${S.char==='Justine'?A.bj:A.bg})`;$('#battle').classList.remove('hide');enable(true)}function enable(v){$$('#battle .acts button').forEach(b=>b.disabled=!v);if(battle&&battle.used)$('#syrachi').disabled=true}function hit(){let d=battle.s.power+Math.floor(Math.random()*5);if(battle.dog){d=Math.ceil(d/2);battle.dog=false}S.energy=Math.max(0,S.energy-d);update();save();if(!S.energy){$('#battleText').textContent='Épuisé·e. Syrachi te ramène à la cabane.';enable(false);setTimeout(()=>{S.x=0;S.y=3;S.energy=100;battle=null;$('#battle').classList.add('hide');update();save()},1000);return true}$('#battleStatus').textContent=`Riposte : -${d} énergie`;return false}$('#observe').onclick=()=>{enable(false);let d=15+Math.floor(Math.random()*18);battle.hp=Math.max(7,battle.hp-d);$('#enemyHp').style.width=battle.hp+'%';$('#battleText').textContent=`Tu observes et fatigues le requin. Il sera plus facile à capturer.`;setTimeout(()=>{if(!hit())enable(true)},650)};$('#syrachi').onclick=()=>{battle.dog=true;battle.used=true;$('#battleText').textContent='Syrachi attire son attention : la prochaine riposte sera réduite.';$('#battleStatus').textContent='Syrachi protège';$('#syrachi').disabled=true};$('#catch').onclick=()=>{if(!S.balls)return $('#battleText').textContent='Plus de Pokéballs.';S.balls--;update();save();enable(false);let ch=Math.min(.94,battle.s.base+(100-battle.hp)/125);$('#battleText').textContent='Pokéball lancée…';setTimeout(()=>{if(Math.random()<ch){S.caught[battle.s.id]=(S.caught[battle.s.id]||0)+1;update();save();$('#battleText').textContent=`Capturé ! ${battle.s.name} rejoint le SharkDex.`;setTimeout(()=>{battle=null;$('#battle').classList.add('hide')},900)}else{$('#battleText').textContent='Le requin se libère !';if(!hit())enable(true)}},850)};$('#run').onclick=()=>{enable(false);if(Math.random()<.82){$('#battleText').textContent='Vous vous repliez avec Syrachi.';setTimeout(()=>{battle=null;$('#battle').classList.add('hide')},500)}else{$('#battleText').textContent='Impossible de reculer !';if(!hit())enable(true)}};
$$('.choice').forEach(b=>b.onclick=()=>{$$('.choice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selected=b.dataset.c;$('#go').disabled=false;$('#go').textContent='Commencer avec '+selected});function enter(){S.char=selected||S.char;$('#start').classList.add('hide');$('#game').classList.remove('hide');update();save()}$('#go').onclick=()=>{S={char:selected,x:2,y:4,px:2,py:4,energy:100,balls:8,caught:{},steps:0};enter()};if(load()){$('#resume').classList.remove('hide');$('#resume').onclick=()=>{selected=S.char;enter()}};$$('[data-d]').forEach(b=>b.onclick=()=>{let d=b.dataset.d;move(d==='r'?1:d==='l'?-1:0,d==='d'?1:d==='u'?-1:0)});window.addEventListener('keydown',e=>{if(e.key==='ArrowUp')move(0,-1);if(e.key==='ArrowDown')move(0,1);if(e.key==='ArrowLeft')move(-1,0);if(e.key==='ArrowRight')move(1,0)});$('#dexBtn').onclick=()=>{let g=$('#dex');g.innerHTML='';sharks.forEach(s=>{let n=S.caught[s.id]||0,d=document.createElement('div');d.className='item'+(n?'':' lock');d.innerHTML=`<b>${n?s.emoji+' '+s.name:'❔ Espèce inconnue'}</b><div>${n?s.rarity+' • x'+n:'Explore les lagons'}</div>`;g.appendChild(d)});$('#dexModal').classList.remove('hide')};$('#bagBtn').onclick=()=>{$('#bag').innerHTML=`<div class='item'>🔴 Pokéballs : <b>${S.balls}</b></div><div class='item'>❤️ Énergie : <b>${S.energy}/100</b></div><div class='item'>🐕 Syrachi : réduit une riposte par rencontre.</div>`;$('#bagModal').classList.remove('hide')};$$('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).classList.add('hide'));update();renderMini()})();
</script></body></html>
