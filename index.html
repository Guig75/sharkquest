<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>SharkQuest — L'île de Syrachi</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(#bfe8ef,#f4e4b5);color:#17353a}button{font:inherit;cursor:pointer}#app{max-width:760px;margin:auto;padding:10px}.card{background:#fffef8ee;border:2px solid #ffffff;border-radius:22px;box-shadow:0 10px 30px #17353a24;padding:16px}.hidden{display:none!important}h1{font-size:clamp(30px,8vw,54px);line-height:.95;margin:5px 0 8px;letter-spacing:-.05em}.sub{margin:0 0 16px;color:#537075;font-weight:650}.hero{height:180px;border-radius:18px;background:linear-gradient(160deg,#69c5d2 0 48%,#e8ce88 48%);position:relative;overflow:hidden}.hero:after{content:'🐕';position:absolute;font-size:88px;right:12%;bottom:4px;filter:drop-shadow(0 8px 5px #0003)}.hero:before{content:'SYRACHI';position:absolute;z-index:2;right:10px;top:10px;background:#fff;padding:7px 10px;border-radius:999px;font-weight:900;font-size:12px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.choice{border:3px solid transparent;border-radius:18px;padding:14px;background:#eef6f3;min-height:100px}.choice.sel{border-color:#0b6f79;background:#d8f0ee}.avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;margin:auto;background:#0b6f79;color:white;font-weight:950;font-size:23px}.choice b{display:block;margin-top:8px}.go{width:100%;min-height:50px;border:0;border-radius:15px;background:#0b6f79;color:#fff;font-weight:950;font-size:17px}.go:disabled{opacity:.4}.hud{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.name{font-weight:950;margin-right:auto}.pill{background:#fff;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:850;border:1px solid #17353a20}.mapbox{position:relative;border:4px solid white;border-radius:20px;overflow:hidden;background:#62bdc7;box-shadow:0 8px 26px #17353a28}canvas{width:100%;height:auto;display:block;image-rendering:pixelated}.toast{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#17353ae8;color:white;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;opacity:0;transition:.18s;pointer-events:none;max-width:88%;text-align:center}.toast.show{opacity:1}.controls{display:grid;grid-template-columns:145px 1fr;gap:10px;margin-top:10px}.dpad{display:grid;grid-template-columns:repeat(3,45px);grid-template-rows:repeat(3,45px);gap:3px;justify-content:center}.dpad button,.side button{border:0;border-radius:13px;background:#fff;box-shadow:0 3px 10px #0001;font-weight:950;min-height:44px}.up{grid-column:2}.left{grid-row:2;grid-column:1}.down{grid-row:2;grid-column:2}.right{grid-row:2;grid-column:3}.side{display:grid;grid-template-columns:1fr 1fr;gap:7px}.objective{grid-column:1/-1;background:#fff;border-radius:12px;padding:8px 10px;font-size:12px;line-height:1.3}.modal{position:fixed;inset:0;background:#071f24aa;display:flex;align-items:center;justify-content:center;padding:12px;z-index:10}.modalcard{width:min(600px,100%);max-height:92vh;overflow:auto;background:#fffaf0;border:3px solid white;border-radius:24px;padding:14px;box-shadow:0 20px 70px #0006}.battle{height:230px;border-radius:18px;background:linear-gradient(#bfe7eb 0 50%,#62b7c3 50%);position:relative;overflow:hidden}.battle:after{content:'';position:absolute;inset:50% 0 auto;height:50%;background:radial-gradient(ellipse at 50% 10%,#82d2d6 0 25%,transparent 26%),linear-gradient(#63bdc8,#338d9a);opacity:.8}.shark{position:absolute;right:8%;top:68px;font-size:100px;z-index:2;filter:drop-shadow(0 8px 5px #0003);transform:scaleX(-1)}.trainer{position:absolute;left:7%;bottom:18px;width:78px;height:78px;border-radius:50%;background:#0b6f79;color:white;display:grid;place-items:center;font-weight:950;font-size:28px;z-index:3;border:5px solid white}.dog{position:absolute;left:27%;bottom:18px;font-size:50px;z-index:3}.enemy{position:absolute;left:10px;top:10px;background:#fffffff2;border-radius:13px;padding:8px 10px;z-index:4;min-width:170px}.enemy b{display:block}.hp{height:9px;background:#ddd;border-radius:99px;overflow:hidden;margin-top:5px}.hp i{display:block;height:100%;background:#51a65e;transition:.2s}.battletext{background:#fff;border-radius:14px;padding:10px;margin-top:8px;min-height:48px;font-weight:750}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.actions button{border:0;border-radius:14px;padding:12px 8px;min-height:48px;font-weight:900;background:#e7f0ed}.actions .catch{background:#e95f63;color:#fff}.actions .run{background:#f0dfac}.head{display:flex;align-items:center;justify-content:space-between}.x{width:42px;height:42px;border:0;border-radius:50%;font-weight:950}.dex{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dexitem{background:#eef4f0;border-radius:14px;padding:10px}.dexitem.lock{filter:grayscale(1);opacity:.45}.dexemoji{font-size:38px}.tiny{font-size:12px;color:#61767a}.ball{display:inline-block;width:18px;height:18px;border-radius:50%;background:linear-gradient(#e85256 0 46%,#1e3336 46% 56%,#fff 56%);vertical-align:-4px;border:1px solid #17353a66;margin-right:3px}@media(max-width:520px){.controls{grid-template-columns:135px 1fr}.dpad{grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px)}.choices{grid-template-columns:1fr 1fr}.dex{grid-template-columns:1fr}.shark{font-size:84px}}
</style>
</head>
<body><main id="app">
<section id="start" class="card"><div class="hero"></div><h1>SharkQuest</h1><p class="sub">L'île de Syrachi — attrape les requins sauvages !</p><div class="choices"><button class="choice" data-who="Justine"><div class="avatar">J</div><b>Justine</b></button><button class="choice" data-who="Guillaume"><div class="avatar">G</div><b>Guillaume</b></button></div><button id="startBtn" class="go" disabled>Choisis ton personnage</button></section>
<section id="game" class="hidden"><div class="hud"><span id="hudAvatar" class="avatar" style="width:40px;height:40px;font-size:17px"></span><span id="hudName" class="name"></span><span class="pill">⚪ <strong id="balls">5</strong> Pokéballs</span><span class="pill">🦈 <strong id="caught">0</strong>/7</span></div><div class="mapbox"><canvas id="map" width="720" height="480"></canvas><div id="toast" class="toast"></div></div><div class="controls"><div class="dpad"><button class="up">▲</button><button class="left">◀</button><button class="down">▼</button><button class="right">▶</button></div><div class="side"><button id="dexBtn">📘 Sharkdex</button><button id="bagBtn">🎒 Sac</button><div class="objective">🌿 Marche dans les hautes herbes. Syrachi te suit partout. La cabane 🏠 redonne 3 Pokéballs.</div></div></div></section>
</main>
<div id="battleModal" class="modal hidden"><div class="modalcard"><div class="battle"><div class="enemy"><b id="enemyName"></b><span class="tiny">Niv. <span id="enemyLv"></span></span><div class="hp"><i id="hpFill"></i></div></div><div id="sharkEmoji" class="shark">🦈</div><div id="battleTrainer" class="trainer"></div><div class="dog">🐕</div></div><div id="battleText" class="battletext"></div><div class="actions"><button id="attackBtn">💥 Attaquer</button><button id="catchBtn" class="catch"><span class="ball"></span> Pokéball</button><button id="calmBtn">🐕 Syrachi encourage</button><button id="runBtn" class="run">🏃 Fuir</button></div></div></div>
<div id="infoModal" class="modal hidden"><div class="modalcard"><div class="head"><h2 id="infoTitle">Sharkdex</h2><button id="closeInfo" class="x">✕</button></div><div id="infoBody"></div></div></div>
<script>
(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let who=null;const W=12,H=8,T=60;const terrain=["wwwwwwwwwwww","wgggggggggpw","wggggppgggpw","wgggpppgggpw","wgggggggggpw","wggggggghgpw","wgggggggggpw","wwwwwwwwwwww"].map(r=>r.split(''));const sharks=[{n:'Requin de récif',e:'🦈',r:'Commun',c:.62},{n:'Requin marteau',e:'🦈',r:'Commun',c:.55},{n:'Requin tigre',e:'🐯🦈',r:'Peu commun',c:.46},{n:'Requin mako',e:'💨🦈',r:'Rare',c:.36},{n:'Grand requin blanc',e:'⚪🦈',r:'Rare',c:.30},{n:'Requin-baleine',e:'🌌🦈',r:'Très rare',c:.24},{n:'Mégalodon',e:'🦷🦈',r:'Légendaire',c:.12}];let state={x:5,y:5,px:4,py:5,balls:5,caught:{},steps:0};let battle=null;const cv=$('#map'),ctx=cv.getContext('2d');$$('.choice').forEach(b=>b.onclick=()=>{$$('.choice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');who=b.dataset.who;$('#startBtn').disabled=false;$('#startBtn').textContent='Partir à l’aventure avec '+who});$('#startBtn').onclick=()=>{const saved=localStorage.getItem('sharkquest-save');if(saved){try{const s=JSON.parse(saved);if(s.who===who)state=s.state}catch{}}$('#start').classList.add('hidden');$('#game').classList.remove('hidden');$('#hudName').textContent=who;$('#hudAvatar').textContent=who[0];draw();refresh();toast('Syrachi te suit ! Trouve les requins dans les hautes herbes 🌿')};function save(){localStorage.setItem('sharkquest-save',JSON.stringify({who,state}))}function refresh(){$('#balls').textContent=state.balls;$('#caught').textContent=Object.keys(state.caught).length}function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1700)}function draw(){for(let y=0;y<H;y++)for(let x=0;x<W;x++){let q=terrain[y][x];ctx.fillStyle=q==='w'?'#58b7c5':q==='p'?'#d9bd78':q==='h'?'#b8784a':'#79bd59';ctx.fillRect(x*T,y*T,T,T);if(q==='g'){ctx.fillStyle='#58a845';for(let i=0;i<4;i++){ctx.fillRect(x*T+8+i*12,y*T+17+(i%2)*8,5,20)}}if(q==='w'){ctx.strokeStyle='#a8e5e9';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x*T+20,y*T+28,14,0,Math.PI);ctx.stroke()}}ctx.font='38px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🏠',9*T+T/2,5*T+T/2);ctx.font='30px system-ui';ctx.fillText('🐕',state.px*T+T/2,state.py*T+T/2+4);ctx.fillStyle=who==='Justine'?'#bc5e83':'#246b88';ctx.beginPath();ctx.arc(state.x*T+T/2,state.y*T+T/2,20,0,Math.PI*2);ctx.fill();ctx.fillStyle='white';ctx.font='bold 18px system-ui';ctx.fillText(who?who[0]:'?',state.x*T+T/2,state.y*T+T/2+1)}function move(dx,dy){if(battle)return;let nx=state.x+dx,ny=state.y+dy;if(nx<0||ny<0||nx>=W||ny>=H||terrain[ny][nx]==='w')return toast('Syrachi ne veut pas aller dans l’eau !');state.px=state.x;state.py=state.y;state.x=nx;state.y=ny;state.steps++;draw();if(terrain[ny][nx]==='h'){state.balls+=3;toast('🏠 Cabane : +3 Pokéballs !');refresh();save();return}if(terrain[ny][nx]==='g'&&Math.random()<.23&&state.steps>2)encounter();save()}$$('.dpad button').forEach((b,i)=>{});$('.up').onclick=()=>move(0,-1);$('.down').onclick=()=>move(0,1);$('.left').onclick=()=>move(-1,0);$('.right').onclick=()=>move(1,0);document.addEventListener('keydown',e=>{if($('#game').classList.contains('hidden'))return;const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};if(m[e.key]){e.preventDefault();move(...m[e.key])}});function pickShark(){let r=Math.random();return r<.32?sharks[0]:r<.57?sharks[1]:r<.74?sharks[2]:r<.86?sharks[3]:r<.94?sharks[4]:r<.985?sharks[5]:sharks[6]}function encounter(){let s=pickShark(),lv=2+Math.floor(Math.random()*9);battle={s,lv,hp:100,max:100,boost:0};$('#enemyName').textContent=s.n;$('#enemyLv').textContent=lv;$('#sharkEmoji').textContent=s.e;$('#battleTrainer').textContent=who[0];$('#battleModal').classList.remove('hidden');setText('Un '+s.n+' sauvage apparaît !');updateHP()}function setText(t){$('#battleText').textContent=t}function updateHP(){$('#hpFill').style.width=battle.hp+'%';$('#hpFill').style.background=battle.hp<30?'#e05a55':battle.hp<60?'#e0ad45':'#51a65e'}function attack(){if(!battle)return;let dmg=15+Math.floor(Math.random()*18)+battle.boost;battle.boost=0;battle.hp=Math.max(0,battle.hp-dmg);updateHP();if(battle.hp<=0){setText(battle.s.n+' s’enfuit après le combat…');return setTimeout(endBattle,900)}setText(who+' affaiblit le requin de '+dmg+' PV. Il est plus facile à capturer !')}function catchShark(){if(!battle)return;if(state.balls<=0)return setText('Plus de Pokéballs ! Retourne à la cabane 🏠.');state.balls--;refresh();let bonus=(100-battle.hp)/150;let chance=Math.min(.92,battle.s.c+bonus);if(Math.random()<chance){state.caught[battle.s.n]=(state.caught[battle.s.n]||0)+1;setText('✨ Capturé ! '+battle.s.n+' rejoint ton Sharkdex.');refresh();save();setTimeout(endBattle,1000)}else setText('La Pokéball s’ouvre… Le requin résiste ! Affaiblis-le davantage.')}function calm(){if(!battle)return;battle.boost=8;setText('🐕 Syrachi aboie avec enthousiasme ! Ta prochaine attaque sera plus efficace.')}function endBattle(){battle=null;$('#battleModal').classList.add('hidden');draw()}$('#attackBtn').onclick=attack;$('#catchBtn').onclick=catchShark;$('#calmBtn').onclick=calm;$('#runBtn').onclick=()=>{if(Math.random()<.8){setText('Vous prenez la fuite avec Syrachi !');setTimeout(endBattle,500)}else setText('Impossible de fuir pour l’instant !')};$('#dexBtn').onclick=()=>showDex();$('#bagBtn').onclick=()=>showBag();$('#closeInfo').onclick=()=>$('#infoModal').classList.add('hidden');function showDex(){$('#infoTitle').textContent='📘 Sharkdex';$('#infoBody').innerHTML='<div class="dex">'+sharks.map(s=>{let n=state.caught[s.n]||0;return `<div class="dexitem ${n?'':'lock'}"><div class="dexemoji">${n?s.e:'❔'}</div><b>${n?s.n:'Requin inconnu'}</b><div class="tiny">${n?s.r+' · Capturé x'+n:'Explore les hautes herbes pour le découvrir'}</div></div>`}).join('')+'</div>';$('#infoModal').classList.remove('hidden')}function showBag(){$('#infoTitle').textContent='🎒 Sac';$('#infoBody').innerHTML=`<div class="card" style="box-shadow:none"><h3><span class="ball"></span> Pokéballs : ${state.balls}</h3><p>Utilise-les pendant une rencontre. Plus le requin est affaibli, plus la capture a de chances de réussir.</p><p>🏠 La cabane sur la carte te donne 3 Pokéballs à chaque passage.</p><p>🐕 Syrachi peut encourager ${who} pendant le combat et renforcer la prochaine attaque.</p></div>`;$('#infoModal').classList.remove('hidden')}draw();})();
</script></body></html>
